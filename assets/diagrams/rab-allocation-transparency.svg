<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <style>
    .title { font: 700 42px DejaVu Sans, sans-serif; fill: #171717; }
    .sub { font: 25px DejaVu Sans, sans-serif; fill: #657087; }
    .head { font: 700 25px DejaVu Sans, sans-serif; fill: #171717; }
    .body { font: 22px DejaVu Sans, sans-serif; fill: #202020; }
    .small { font: 20px DejaVu Sans, sans-serif; fill: #303030; }
    .line { stroke: #697386; stroke-width: 4; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#697386"/>
    </marker>
  </defs>

  <text x="800" y="70" text-anchor="middle" class="title">How the 15,000,000 RAB genesis allocation is made auditable</text>
  <text x="800" y="112" text-anchor="middle" class="sub">Genesis allocation and later consensus issuance are separate, publicly verifiable components.</text>

  <rect x="470" y="145" width="660" height="105" rx="24" fill="#fff3cf" stroke="#b77b00" stroke-width="4"/>
  <text x="800" y="190" text-anchor="middle" class="head">15,000,000 RAB genesis allocation</text>
  <text x="800" y="225" text-anchor="middle" class="small">Not a maximum-supply claim</text>

  <rect x="75" y="320" width="670" height="250" rx="26" fill="#eef3ff" stroke="#5b70e8" stroke-width="4"/>
  <text x="410" y="365" text-anchor="middle" class="head">10,000,000 RAB genesis reserve</text>
  <text x="410" y="405" text-anchor="middle" class="body">Staking and protocol participation</text>
  <text x="410" y="445" text-anchor="middle" class="small">Separate from consensus block rewards</text>
  <text x="410" y="480" text-anchor="middle" class="small">Custody, release, authorization, and balances</text>
  <text x="410" y="512" text-anchor="middle" class="small">must be published before mainnet</text>

  <rect x="855" y="320" width="670" height="250" rx="26" fill="#eefbf2" stroke="#1c9b4a" stroke-width="4"/>
  <text x="1190" y="365" text-anchor="middle" class="head">5,000,000 RAB contract reserves</text>
  <text x="1190" y="405" text-anchor="middle" class="body">2,000,000 liquidity - 1,000,000 community</text>
  <text x="1190" y="440" text-anchor="middle" class="body">400,000 operations - 100,000 testnet rewards</text>
  <text x="1190" y="475" text-anchor="middle" class="body">1,500,000 creator and developers</text>
  <text x="1190" y="510" text-anchor="middle" class="small">Contracts deploy at precomputed addresses</text>
  <text x="1190" y="542" text-anchor="middle" class="small">in the first mainnet blocks</text>

  <rect x="260" y="665" width="1080" height="155" rx="26" fill="#eef7ff" stroke="#3977b7" stroke-width="4"/>
  <text x="800" y="710" text-anchor="middle" class="head">Consensus issuance is additional and follows the active reward schedule</text>
  <text x="800" y="755" text-anchor="middle" class="body">1.20 -&gt; 0.60 -&gt; 0.30 -&gt; 0.15 RAB per block</text>
  <text x="800" y="795" text-anchor="middle" class="small">The permanent 0.15 RAB tail reward means supply has no finite maximum.</text>

  <path d="M690 250 L410 315" class="line" marker-end="url(#arrow)"/>
  <path d="M910 250 L1190 315" class="line" marker-end="url(#arrow)"/>
  <path d="M410 570 L690 660" class="line" marker-end="url(#arrow)"/>
  <path d="M1190 570 L910 660" class="line" marker-end="url(#arrow)"/>
</svg>
